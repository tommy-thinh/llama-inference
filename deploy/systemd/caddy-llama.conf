# Install as /etc/systemd/system/caddy.service.d/llama.conf only after review.
# Keep the official package's non-root caddy user, capabilities, data paths,
# ExecStart, and ExecReload. Do not replace an existing Caddy deployment.
[Service]
EnvironmentFile=/etc/llama/caddy.env
MemoryHigh=192M
MemoryMax=256M
CPUQuota=100%
TasksMax=128
TimeoutStopSec=20
KillMode=control-group
