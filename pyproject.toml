[project]
name = "llama-inference-foundation"
version = "0.1.0"
description = "CPU-only Llama 3.2 1B Instruct inference and reproducible baseline experiments"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "anyio>=4.16,<5",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20.1,<1.21",
    "psycopg>=3.3.8,<3.4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.optional-dependencies]
charts = ["matplotlib>=3.10.7,<3.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["inference: opt-in tests starting the real CPU model server"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
