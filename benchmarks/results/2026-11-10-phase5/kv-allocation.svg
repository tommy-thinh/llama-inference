<title id="chart-title">KV-cache memory allocation</title><desc id="chart-description">Measured runtime KV-buffer allocation in MiB. Left: compare cache precision at 2,048 tokens and one slot. Right: FP16 context and slot capacity; the shared 64 MiB reference is repeated. Panels use separately labeled, zero-based linear axes. Process RSS is not shown.</desc><metadata id="benchmark-data">{"metric":"allocated_mib","unit":"MiB","scale":"linear","records":[{"kv_type":"f16","context_per_slot":1024,"parallel":1,"value":32.0},{"kv_type":"f16","context_per_slot":2048,"parallel":1,"value":64.0},{"kv_type":"f16","context_per_slot":4096,"parallel":1,"value":128.0},{"kv_type":"q8_0","context_per_slot":2048,"parallel":1,"value":34.0},{"kv_type":"q4_0","context_per_slot":2048,"parallel":1,"value":18.0},{"kv_type":"f16","context_per_slot":2048,"parallel":4,"value":256.0}]}</metadata></svg>
